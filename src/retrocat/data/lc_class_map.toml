# DELIBERATELY UNMAPPED: "Fiction" / "Juvenile Fiction". The collection this
# map was built for holds effectively no fiction, so those Google categories
# almost always signal a mis-tag (seen live: a lynching memoir tagged
# "Juvenile Fiction"). Rather than shelve those in a confident-but-wrong PZ,
# they fall through to default_class above and are flagged for review. Add
# "fiction" = "PZ" (or PS/PR) in your override file if your collection holds
# real fiction.
