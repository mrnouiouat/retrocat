# Class-level LC fallback map: keyword found in a book's subject signals
# (Google Books categories + OpenLibrary subject headings) -> LC class.
# lc_call.py then enriches the bare class with a Cutter + year into a
# shelf-able number, tagged confidence=low for human spot-check.
#
# THIS SHIPPED MAP IS A WORKED EXAMPLE, TUNED TO ONE COLLECTION. It was
# built for an academic religious-studies (Islamic seminary) library and
# its Tier 1 reflects that. It covers the small BISAC vocabulary Google
# actually returns, so it works acceptably as a general-collection default,
# but you should review Tier 1, and the fiction note at the bottom ,
# against your own collection. Point [lookup].class_map_file in config.toml
# at your own copy to override without touching the package.
#
# ORDER MATTERS: lookup takes the FIRST keyword found in the joined subject
# string, so a longer/narrower keyword MUST precede any word it contains
# ("islamic law" before "islam", "social science" before "science",
# "business & economics" before "business", "performing arts" before "art").

# Last-resort class used when NOTHING maps, no authoritative call number
# and no matching keyword. The project rule is that every titled book leaves
# with a call number, never blank, so it can always be shelved somewhere.
# "AC" is LC "General Works / Collections", the honest neighborhood for a
# genuinely-unclassified item; such rows are tagged source=default and
# surfaced separately in review output.
default_class = "AC"

[classes]
